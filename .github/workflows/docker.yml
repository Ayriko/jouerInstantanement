name: Docker Build and Push

on:
    workflow_run:
        workflows:
            - CI
        branches:
            - main
        types:
            - completed

env:
    REGISTRY: ghcr.io

jobs:
    build-and-push:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        strategy:
            matrix:
                app:
                    - name: api-gateway
                      dockerfile: ./apps/api-gateway/Dockerfile
                      build_arg: api-gateway
                    - name: auth
                      dockerfile: ./apps/auth/Dockerfile
                      build_arg: auth
                    - name: games
                      dockerfile: ./apps/games/Dockerfile
                      build_arg: games
                    - name: users
                      dockerfile: ./apps/users/Dockerfile
                      build_arg: users
                    - name: wishlists
                      dockerfile: ./apps/wishlists/Dockerfile
                      build_arg: wishlists
                    - name: keys
                      dockerfile: ./apps/keys/Dockerfile
                      build_arg: keys
                    - name: payments
                      dockerfile: ./apps/payments/Dockerfile
                      build_arg: payments
                    - name: web
                      dockerfile: ./apps/web/Dockerfile
                      build_arg: web

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Extract metadata for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app.name }}
                  tags: |
                      type=sha,prefix={{branch}}-
                      type=ref,event=branch
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ${{ matrix.app.dockerfile }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      SERVICE_NAME=${{ matrix.app.build_arg }}
                  cache-from: type=gha,scope=${{ matrix.app.name }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}
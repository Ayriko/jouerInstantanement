services:
    db:
        image: postgres:17
        container_name: db
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
            POSTGRES_DB: ${POSTGRES_DB:-api_db}
        volumes:
            - pg_data:/var/lib/postgresql/data
        networks:
            - backend
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    pgbouncer:
        image: rmccaffrey/pgbouncer:latest
        container_name: pgbouncer
        environment:
            DB_HOST: db
            DB_PORT: 5432
            DB_USER: ${POSTGRES_USER:-postgres}
            DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
            POOL_MODE: transaction
            MAX_CLIENT_CONN: 100
            DEFAULT_POOL_SIZE: 20
            AUTH_TYPE: scram-sha-256
        ports:
            - "6432:5432"
        depends_on:
            db:
                condition: service_healthy
        networks:
            - backend
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    redis:
        image: redis:7
        container_name: redis
        ports:
            - "6379:6379"
        networks:
            - backend
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    minio:
        image: minio/minio
        container_name: minio
        command: server /data --console-address ":9001"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 30s
            timeout: 20s
            retries: 3
            start_period: 15s
        environment:
            - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
            - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
        networks:
            - backend
        volumes:
            - minio_data:/data
        ports:
            - "9000:9000"
            - "9001:9001" # Minio Console (optional)


networks:
    backend:

volumes:
    pg_data:
    minio_data: